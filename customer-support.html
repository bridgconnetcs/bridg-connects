<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="color-scheme" content="light only"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Help — Bridg Connects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{color-scheme:light only;
      --white:#FFFFFF;--ink:#0B0B0C;--steel:#4A4A50;--hairline:#E8E8EA;--band:#F6F6F7;
      --orange:#FF640D;--orange-soft:rgba(255,100,13,.08);
      --FD:'Space Grotesk',sans-serif;--FB:'Inter',sans-serif;--FM:'JetBrains Mono',monospace}
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth;background:#FFFFFF !important}
    body{background:#FFFFFF !important;color:var(--ink) !important;font-family:var(--FB);line-height:1.6;-webkit-font-smoothing:antialiased}
    
    /* NAV */
    nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--hairline)}
    .nav-in{max-width:1200px;margin:0 auto;padding:.85rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
    .back{font-family:var(--FM);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);text-decoration:none}
    .back:hover{color:var(--orange)}
    .logo{font-family:var(--FD);font-weight:700;font-size:1.15rem;letter-spacing:.04em;color:var(--ink);text-decoration:none;line-height:1;text-align:center}
    .logo span{color:var(--orange)}
    .logo small{display:block;font-family:var(--FM);font-size:.45rem;letter-spacing:.42em;color:var(--steel);font-weight:400;margin-top:1px}
    .nav-controls{display:flex;align-items:center;gap:1.2rem}
    .user-email{font-size:.85rem;color:var(--steel)}
    .lang-tg{display:flex;border:1px solid var(--hairline);border-radius:6px;overflow:hidden}
    .lang-tg button{border:0;background:transparent;padding:.35rem .65rem;font-family:var(--FM);font-size:.65rem;cursor:pointer;color:var(--steel)}
    .lang-tg button.on{background:var(--ink);color:#fff}
    .logout-btn{font-family:var(--FM);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;background:transparent;border:1px solid var(--hairline);padding:.35rem .7rem;cursor:pointer;color:var(--steel);transition:all .2s;border-radius:4px}
    .logout-btn:hover{border-color:var(--orange);color:var(--orange)}

    /* AUTH GUARD */
    .auth-guard{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:2000}
    .auth-box{text-align:center;max-width:380px;padding:2rem}
    .auth-box h2{font-family:var(--FD);font-weight:700;font-size:1.8rem;color:var(--ink);margin-bottom:.8rem}
    .auth-box p{font-size:.95rem;color:var(--steel);margin-bottom:1.6rem}
    .auth-box a{display:inline-block;font-family:var(--FD);font-weight:600;font-size:.85rem;letter-spacing:.05em;background:var(--orange);color:#fff;padding:.7rem 1.6rem;text-decoration:none;border-radius:6px;transition:all .2s}
    .auth-box a:hover{background:#cc4d00}

    /* MAIN */
    .wrap{max-width:1200px;margin:0 auto;padding:3rem 1.5rem}
    .eyebrow{font-family:var(--FM);font-size:.62rem;letter-spacing:.24em;color:var(--orange);text-transform:uppercase;display:inline-flex;align-items:center;gap:.55rem;background:var(--orange-soft);border:1px solid rgba(255,100,13,.25);border-radius:100px;padding:.55rem 1.1rem;margin-bottom:1.2rem}
    .eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--orange)}
    h1{font-family:var(--FD);font-weight:700;font-size:clamp(2rem,5vw,3rem);line-height:1.05;letter-spacing:-.01em}
    h1 em{font-style:normal}
    .sub{font-size:.98rem;font-weight:300;color:var(--steel);margin-top:1rem;max-width:520px}

    /* LAYOUT: 2-COLUMN */
    .content{display:grid;grid-template-columns:1.2fr 1fr;gap:2rem;margin-top:2.5rem}
    @media(max-width:900px){.content{grid-template-columns:1fr;gap:1.5rem}}

    /* LEFT: DELIVERIES */
    .deliveries{background:var(--band);border-radius:12px;padding:2rem;min-height:400px}
    .deliveries h2{font-family:var(--FD);font-weight:600;font-size:1.2rem;letter-spacing:-.01em;margin-bottom:1.6rem;color:var(--ink)}
    .delivery-item{background:#fff;border:1px solid var(--hairline);border-radius:8px;padding:1.4rem;margin-bottom:1.2rem;transition:all .2s}
    .delivery-item:hover{border-color:var(--orange);box-shadow:0 2px 8px rgba(255,100,13,.08)}
    .delivery-item:last-child{margin-bottom:0}
    .del-code{font-family:var(--FM);font-size:.95rem;font-weight:600;color:var(--orange);margin-bottom:.4rem}
    .del-status{font-size:.88rem;color:var(--steel);margin-bottom:.8rem}
    .del-status.active{color:var(--orange);font-weight:600}
    .del-meta{display:grid;grid-template-columns:1fr 1fr;gap:1rem;font-size:.85rem}
    .del-meta-item{border-left:2px solid var(--orange);padding-left:.8rem}
    .del-meta-label{font-family:var(--FM);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:#999;margin-bottom:.2rem}
    .del-meta-value{color:var(--ink);font-weight:500}
    .del-link{font-family:var(--FD);font-size:.8rem;font-weight:600;color:var(--orange);text-decoration:none;margin-top:1rem;display:inline-block;transition:opacity .2s}
    .del-link:hover{opacity:.7}

    .no-deliveries{text-align:center;padding:2.5rem 1rem;color:var(--steel)}
    .no-deliveries h3{font-family:var(--FD);font-weight:600;font-size:1rem;color:var(--ink);margin-bottom:.4rem}

    /* RIGHT: SAGE */
    .sage-box{background:#fff;border:1px solid var(--hairline);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:400px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
    .sage-head{background:var(--band);border-bottom:1px solid var(--hairline);padding:1.4rem}
    .sage-head h2{font-family:var(--FD);font-weight:600;font-size:1.1rem;color:var(--ink);margin-bottom:.2rem}
    .sage-head p{font-size:.85rem;color:var(--steel)}
    .sage-body{flex:1;overflow:hidden}
    #elevenlabs-widget{width:100%;height:100%;border:none}

    /* LOADING */
    .loading{display:flex;align-items:center;justify-content:center;height:300px}
    .spinner{width:32px;height:32px;border:2px solid var(--hairline);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    @media(max-width:600px){
      .nav-in{flex-wrap:wrap;gap:.8rem}
      .logo small{display:none}
      .nav-controls{width:100%;order:3;gap:.8rem}
      .user-email{display:none}
      .content{grid-template-columns:1fr;gap:1.5rem}
      .deliveries,.sage-box{min-height:350px}
    }
  </style>
</head>
<body>

<nav id="navbar">
  <div class="nav-in">
    <a class="back" href="/">← <span id="backLang">Back</span></a>
    <a class="logo" href="/">BRIDG<span>.</span><small>CONNECTS</small></a>
    <div class="nav-controls">
      <span class="user-email" id="userEmail">—</span>
      <div class="lang-tg">
        <button class="on" id="lgEN" onclick="setLang('en')">EN</button>
        <button id="lgES" onclick="setLang('es')">ES</button>
      </div>
      <button class="logout-btn" onclick="logout()" id="logoutLabel">Logout</button>
    </div>
  </div>
</nav>

<div class="auth-guard" id="authGuard" style="display:none">
  <div class="auth-box">
    <h2 id="authTitle">Access Restricted</h2>
    <p id="authMsg">You must log in to access customer support.</p>
    <a href="/" id="authBackLink">← Back to Home</a>
  </div>
</div>

<div class="wrap" id="mainContent" style="display:none">
  <p class="eyebrow" id="eyebrow">Your deliveries & support</p>
  <h1 id="mainTitle">HELP & <em style="color:#FF640D">TRACKING</em></h1>
  <p class="sub" id="mainSub">View your active deliveries and chat with Sage for any questions.</p>

  <div class="content">
    <!-- LEFT: DELIVERIES -->
    <div class="deliveries">
      <h2 id="delTitle">Your Deliveries</h2>
      <div id="deliveryContainer">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- RIGHT: SAGE -->
    <div class="sage-box">
      <div class="sage-head">
        <h2 id="sageTitle">Ask Sage</h2>
        <p id="sageSub">Your support assistant</p>
      </div>
      <div class="sage-body">
        <div id="elevenlabs-widget"></div>
      </div>
    </div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
  import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDjgG0dqXvXnCJl-JFOzpKxXgSV-EkClkQ",
    authDomain: "bridg-connects.firebaseapp.com",
    projectId: "bridg-connects",
    storageBucket: "bridg-connects.appspot.com",
    messagingSenderId: "841383220555",
    appId: "1:841383220555:web:0c48a4e6eab85c4f7bfcc0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentLang = 'en';

  const translations = {
    en: {
      back: 'Back',
      logout: 'Logout',
      eyebrow: 'Your deliveries & support',
      title: 'HELP & TRACKING',
      sub: 'View your active deliveries and chat with Sage for any questions.',
      delTitle: 'Your Deliveries',
      sageTitle: 'Ask Sage',
      sageSub: 'Your support assistant',
      noDeliveries: 'No active deliveries',
      noDeliveriesMsg: 'You have no deliveries at the moment.',
      authTitle: 'Access Restricted',
      authMsg: 'You must log in to access customer support.',
      authBack: '← Back to Home'
    },
    es: {
      back: 'Volver',
      logout: 'Cerrar sesión',
      eyebrow: 'Tus entregas y soporte',
      title: 'AYUDA Y RASTREO',
      sub: 'Mira tus entregas activas y chatea con Sage para cualquier pregunta.',
      delTitle: 'Tus Entregas',
      sageTitle: 'Pregunta a Sage',
      sageSub: 'Tu asistente de soporte',
      noDeliveries: 'Sin entregas activas',
      noDeliveriesMsg: 'No tienes entregas en este momento.',
      authTitle: 'Acceso Restringido',
      authMsg: 'Debes iniciar sesión para acceder al soporte.',
      authBack: '← Volver al Inicio'
    }
  };

  function setLang(l) {
    currentLang = l;
    document.body.classList.toggle('es', l === 'es');
    document.getElementById('lgEN').classList.toggle('on', l === 'en');
    document.getElementById('lgES').classList.toggle('on', l === 'es');
    updateText();
  }

  function updateText() {
    const t = translations[currentLang];
    document.getElementById('backLang').textContent = t.back;
    document.getElementById('logoutLabel').textContent = t.logout;
    document.getElementById('eyebrow').textContent = t.eyebrow;
    document.getElementById('mainTitle').textContent = `${t.title.split(' ')[0]} & ${t.title.split(' ')[2]}`;
    document.getElementById('mainSub').textContent = t.sub;
    document.getElementById('delTitle').textContent = t.delTitle;
    document.getElementById('sageTitle').textContent = t.sageTitle;
    document.getElementById('sageSub').textContent = t.sageSub;
    document.getElementById('authTitle').textContent = t.authTitle;
    document.getElementById('authMsg').textContent = t.authMsg;
    document.getElementById('authBackLink').textContent = t.authBack;
  }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('userEmail').textContent = user.email;
      document.getElementById('mainContent').style.display = 'block';
      document.getElementById('authGuard').style.display = 'none';
      loadDeliveries(user.uid);
      initializeSageWidget();
    } else {
      document.getElementById('mainContent').style.display = 'none';
      document.getElementById('authGuard').style.display = 'flex';
    }
  });

  async function loadDeliveries(userId) {
    const container = document.getElementById('deliveryContainer');
    try {
      const q = query(collection(db, "deliveries"), where("userId", "==", userId));
      const snapshot = await getDocs(q);
      
      if (snapshot.empty) {
        const t = translations[currentLang];
        container.innerHTML = `
          <div class="no-deliveries">
            <h3>${t.noDeliveries}</h3>
            <p>${t.noDeliveriesMsg}</p>
          </div>
        `;
        return;
      }

      let html = "";
      snapshot.forEach((doc) => {
        const d = doc.data();
        html += `
          <div class="delivery-item">
            <div class="del-code">${d.code || "—"}</div>
            <div class="del-status ${d.status === "in-transit" ? "active" : ""}">
              ${d.status === "in-transit" ? "🟢 In Transit" : "⏳ " + (d.status || "Pending")}
            </div>
            <div class="del-meta">
              <div class="del-meta-item">
                <div class="del-meta-label">Driver</div>
                <div class="del-meta-value">${d.driver || "—"}</div>
              </div>
              <div class="del-meta-item">
                <div class="del-meta-label">ETA</div>
                <div class="del-meta-value">${d.eta || "—"}</div>
              </div>
            </div>
            <a href="https://ordertracking.io/${d.code}" class="del-link" target="_blank">
              Track Order →
            </a>
          </div>
        `;
      });
      container.innerHTML = html;
    } catch (err) {
      console.error("Error loading deliveries:", err);
    }
  }

  function initializeSageWidget() {
    // Load ElevenLabs widget
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/@elevenlabs/convai@latest/index.global.js";
    script.async = true;
    script.onload = () => {
      if (window.ElevenLabsConvAI) {
        new window.ElevenLabsConvAI({
          agentId: "agent_2801kymqshm9eyfs3a1gkfertk3v",
          clientId: currentUser.uid,
          sessionId: "customer-" + Date.now()
        });
      }
    };
    document.head.appendChild(script);
  }

  window.logout = function() {
    signOut(auth).then(() => {
      currentUser = null;
      window.location.href = "/";
    }).catch((err) => {
      console.error("Logout error:", err);
    });
  };

  window.setLang = setLang;
  updateText();
</script>

</body>
</html>
